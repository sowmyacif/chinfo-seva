<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<script>
    // To initialize an absolute zero-cost premium Kanban lane engine:
    function initializeKanbanLanes() {
        const lanes = ['poolList', 'accuracyLane', 'reviewLane', 'formattingLane'];
        
        lanes.forEach(laneId => {
            const element = document.getElementById(laneId);
            if (!element) return;
            
            new Sortable(element, {
                group: 'sevaPipeline', // Allows dragging across different columns
                animation: 250,        // Smooth Wix-like motion animation (ms)
                ghostClass: 'bg-teal-50', // Premium visual placeholder styling
                
                onEnd: async function (evt) {
                    const cardId = evt.item.getAttribute('data-match-id');
                    const targetLane = evt.to.id;
                    
                    // Push live cell update back to your Chinfo Google Sheet row instantly
                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ 
                            action: "updateStatus", 
                            matchId: cardId, 
                            newStatus: targetLane 
                        })
                    });
                }
            });
        });
    }
</script>
