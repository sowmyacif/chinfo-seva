            <h1 class="text-2xl font-extrabold text-teal-800 tracking-tight mt-1">Seva Coordination Portal</h1>
            <p class="text-slate-500 text-xs mt-0.5 font-medium uppercase tracking-wider">Chinmaya International Foundation</p>
            
            <div class="w-full mt-6 bg-white border border-slate-200/80 rounded-2xl p-4 text-left shadow-sm">
                <label class="block text-[11px] font-bold text-teal-800 uppercase tracking-wider mb-2">Select Your Profile</label>
                <div class="relative">
                    <select id="userSevakSelect" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm text-slate-700 font-medium focus:outline-none focus:border-teal-600 focus:bg-white transition-all appearance-none cursor-pointer shadow-inner">
                        <option value="">-- Choose your name from directory --</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>
        </header>

        <div class="space-y-8">
            
            <section>
                <h2 class="text-xs font-bold uppercase tracking-widest mb-4 flex items-center gap-2 text-teal-800">
                    <span class="bg-teal-50 text-teal-700 w-6 h-6 rounded-lg flex items-center justify-center text-xs font-serif shadow-sm">⚡</span> 
                    Open Seva Pool
                </h2>
                <div id="poolList" class="space-y-3">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/60 text-center shadow-sm">
                        <p class="text-slate-400 italic text-sm animate-pulse">Establishing secure handshake with Seva DB...</p>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xs font-bold uppercase tracking-widest mb-4 flex items-center gap-2 text-teal-800">
                    <span class="bg-amber-50 text-amber-600 w-6 h-6 rounded-lg flex items-center justify-center text-xs shadow-sm">🔱</span> 
                    Active Assignments
                </h2>
                <div id="queueList" class="space-y-3">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 text-center shadow-sm">
                        <p class="text-slate-400 italic text-sm">No active assignments monitored.</p>
                    </div>
                </div>
            </section>
            
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6vyOCivrSDjsHoCAVIVPV3eBDqHucTBrxTHFP5l-P-XI7znsoBQRQl31I9VqhElqn/exec";
        let globalMasterSevaks = [];

        async function loadPortalData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                globalMasterSevaks = data.masterSevaks;
                populateSevakDropdown(data.masterSevaks);
                renderPortal(data.portalItems);
            } catch (error) {
                console.error("Error connecting to sheet script backend:", error);
                document.getElementById('poolList').innerHTML = `
                    <div class="bg-rose-50 border border-rose-100 p-4 rounded-xl text-center text-xs font-semibold text-rose-600 shadow-sm">
                        Connection timed out. Please refresh the window.
                    </div>`;
            }
        }

        function populateSevakDropdown(sevaks) {
            const select = document.getElementById('userSevakSelect');
            const currentSelection = select.value;
            
            select.innerHTML = '<option value="">-- Choose your name from directory --</option>';
            sevaks.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name} — [${s.team}]</option>`;
            });
            
            if(currentSelection) select.value = currentSelection;
        }

        async function claimSeva(matchId) {
            const selectedSevakId = document.getElementById('userSevakSelect').value;
            if (!selectedSevakId) {
                alert("Action required: Please select your profile name at the top before committing to a task.");
                return;
            }

            showLoading();
            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "claim", matchId: matchId, sevakId: selectedSevakId })
                });
                loadPortalData();
            } catch(e) {
                alert("Database synchronization failed. Please try again.");
                loadPortalData();
            }
        }

        function showLoading() {
            document.getElementById('poolList').innerHTML = `
                <div class="bg-white p-6 rounded-2xl border border-slate-200/60 text-center shadow-sm">
                    <p class="text-slate-500 italic text-sm animate-pulse font-medium">Recording assignment to master ledger...</p>
                </div>`;
        }

        function renderPortal(items) {
            const poolList = document.getElementById('poolList');
            const queueList = document.getElementById('queueList');
            
            let poolHTML = '';
            let queueHTML = '';

            items.forEach(item => {
                if (item.status === 'available') {
                    poolHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/60 flex justify-between items-center transition-all hover:border-teal-200 hover:shadow-md hover:shadow-slate-100/80 group">
                            <div class="pr-4">
                                <span class="font-bold text-slate-800 text-sm block group-hover:text-teal-700 transition-colors">${item.title}</span>
                                <p class="text-xs text-slate-500 font-medium mt-1 leading-relaxed">${item.description || 'No additional specifications provided.'}</p>
                            </div>
                            <button onclick="claimSeva('${item.matchId}')" class="bg-teal-600 text-white px-4 py-2 rounded-xl text-xs font-bold tracking-wide shadow-md shadow-teal-900/10 hover:bg-teal-700 transition active:scale-95 flex-shrink-0">Accept Seva</button>
                        </div>
                    `;
                } else if (item.status === 'claimed') {
                    queueHTML += `
                        <div class="bg-white p-4 rounded-2xl border border-slate-200/50 shadow-sm flex justify-between items-center relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-amber-500"></div>
                            <div class="pl-2">
                                <div class="font-bold text-slate-700 text-sm">${item.title}</div>
                                <div class="text-[11px] text-slate-400 mt-1 font-medium">Assigned to: <span class="text-slate-800 font-semibold">${item.sevakName}</span> <span class="text-slate-300 mx-1">|</span> <span class="italic text-slate-500">${item.sevakTeam} Team</span></div>
                            </div>
                            <span class="bg-amber-50 text-amber-800 px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider flex-shrink-0 border border-amber-100">In Progress</span>
                        </div>
                    `;
                }
            });

            poolList.innerHTML = poolHTML || `
                <div class="bg-slate-100/60 p-6 rounded-2xl border border-dashed border-slate-200 text-center">
                    <p class="text-slate-400 italic text-xs font-medium">All tasks have been claimed. Pool clear!</p>
                </div>`;
                
            queueList.innerHTML = queueHTML || `
                <div class="bg-slate-100/60 p-4 rounded-2xl border border-dashed border-slate-200 text-center">
                    <p class="text-slate-400 italic text-xs font-medium">No active tasks currently monitored.</p>
                </div>`;
        }

        loadPortalData();
    </script>
</body>
