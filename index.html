            <h1 class="text-xl font-extrabold tracking-tight">Seva Coordination Portal</h1>
            <p class="text-teal-100 text-[11px] font-medium tracking-widest uppercase opacity-90 mt-0.5">Chinmaya International Foundation</p>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4 -mt-6">
        
        <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-200/40 mb-6">
            <label class="block text-[10px] font-bold text-[#008080] uppercase tracking-wider mb-1.5">Active Directory Identity</label>
            <div class="relative">
                <select id="userSevakSelect" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs text-slate-700 font-semibold focus:outline-none focus:border-[#008080] focus:bg-white transition-all appearance-none cursor-pointer">
                    <option value="">-- Choose profile to unlock ecosystem --</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            
            <section>
                <div class="flex items-center justify-between mb-3 px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                        Open Seva Pool
                    </h2>
                    <span id="poolCount" class="text-[10px] font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0</span>
                </div>
                <div id="poolList" class="space-y-3">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/60 text-center text-xs text-slate-400 italic">
                        Synchronizing master ledger pool...
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 px-1 flex items-center gap-1.5">
                    🚀 Active Assignments & Pipelines
                </h2>
                <div id="queueList" class="space-y-4">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/60 text-center text-xs text-slate-400 italic">
                        No active assignments monitored.
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6vyOCivrSDjsHoCAVIVPV3eBDqHucTBrxTHFP5l-P-XI7znsoBQRQl31I9VqhElqn/exec";

        async function loadPortalData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                populateSevakDropdown(data.masterSevaks);
                renderPortal(data.portalItems);
            } catch (error) {
                console.error("Backend offline:", error);
                document.getElementById('poolList').innerHTML = `
                    <div class="bg-rose-50 border border-rose-100 p-4 rounded-xl text-center text-xs font-semibold text-rose-600">
                        Connection timed out. Please clear cache and reload.
                    </div>`;
            }
        }

        function populateSevakDropdown(sevaks) {
            const select = document.getElementById('userSevakSelect');
            const currentSelection = select.value;
            select.innerHTML = '<option value="">-- Choose profile to unlock ecosystem --</option>';
            sevaks.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name} [${s.team}]</option>`;
            });
            if(currentSelection) select.value = currentSelection;
        }

        async function claimSeva(matchId) {
            const selectedSevakId = document.getElementById('userSevakSelect').value;
            if (!selectedSevakId) {
                alert("Action Required: Choose your profile identity card at the top first.");
                return;
            }
            
            document.getElementById('poolList').innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 italic animate-pulse">Provisioning environment vectors...</div>`;
            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "claim", matchId: matchId, sevakId: selectedSevakId })
                });
                loadPortalData();
            } catch(e) {
                alert("Vector mapping sync error.");
                loadPortalData();
            }
        }

        function renderPortal(items) {
            const poolList = document.getElementById('poolList');
            const queueList = document.getElementById('queueList');
            
            let poolHTML = '';
            let queueHTML = '';
            let poolCount = 0;

            items.forEach(item => {
                if (item.status === 'available') {
                    poolCount++;
                    poolHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/50 flex flex-col justify-between gap-3 transition-all hover:shadow-md">
                            <div>
                                <span class="bg-teal-50 text-[#008080] text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider inline-block mb-1">Available Task</span>
                                <h3 class="font-bold text-slate-800 text-sm">${item.title}</h3>
                                <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">${item.description || 'No specialized parameters declared.'}</p>
                            </div>
                            <button onclick="claimSeva('${item.matchId}')" class="w-full bg-[#008080] text-white py-2.5 rounded-xl text-xs font-bold tracking-wide shadow-md shadow-teal-900/10 hover:bg-teal-700 active:scale-[0.98] transition-all">Accept & Initialize Seva</button>
                        </div>
                    `;
                } else if (item.status === 'claimed') {
                    queueHTML += `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-100 flex justify-between items-center">
                                <div class="text-[11px] text-slate-500 font-medium">Assigned to: <b class="text-slate-800">${item.sevakName}</b></div>
                                <span class="bg-amber-50 text-amber-800 px-2 py-0.5 rounded-md text-[9px] font-extrabold uppercase tracking-wider border border-amber-200/60">Stage 1: Accuracy</span>
                            </div>
                            
                            <div class="p-4">
                                <h4 class="font-bold text-slate-800 text-xs">${item.title}</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">${item.description || ''}</p>
                                
                                <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-slate-100">
                                    <a href="https://chat.whatsapp.com/mock-invite" target="_blank" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-[11px] font-semibold p-2.5 rounded-xl flex items-center justify-center gap-1.5 transition-colors">
                                        💬 WhatsApp Group
                                    </a>
                                    <a href="https://drive.google.com/drive/mock" target="_blank" class="bg-blue-50 hover:bg-blue-100 text-blue-800 text-[11px] font-semibold p-2.5 rounded-xl flex items-center justify-center gap-1.5 transition-colors">
                                        📁 Google Drive
                                    </a>
                                </div>
                                <button class="w-full mt-2 bg-slate-800 hover:bg-slate-900 text-white text-[10px] font-bold py-2 rounded-xl tracking-wider uppercase transition-colors">
                                    Mark as Ready for Content Check ➡️
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('poolCount').innerText = poolCount;
            poolList.innerHTML = poolHTML || `<div class="bg-slate-50 p-6 rounded-2xl border border-dashed border-slate-200 text-center text-xs text-slate-400 italic">Pool clear! All tasks deployed into pipeline workspaces.</div>`;
            queueList.innerHTML = queueHTML || `<div class="bg-slate-50 p-6 rounded-2xl border border-dashed border-slate-200 text-center text-xs text-slate-400 italic">No tasks currently traversing active lanes.</div>`;
        }

        loadPortalData();
    </script>
</body>
</html>
