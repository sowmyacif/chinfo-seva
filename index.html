<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinfo Seva Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <div class="max-w-md mx-auto p-6">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-orange-600">🙏 Chinfo Seva</h1>
            <p class="text-slate-500 text-sm mt-1">Real-time Sevak Coordination</p>
            
            <div class="mt-5 bg-orange-50 border border-orange-100 rounded-2xl p-4 text-left shadow-sm">
                <label class="block text-xs font-bold text-orange-700 uppercase tracking-wide mb-1.5">Who is logging in?</label>
                <select id="userSevakSelect" class="w-full bg-white border border-orange-200 p-2.5 rounded-xl text-sm text-slate-700 focus:outline-orange-500 shadow-inner">
                    <option value="">-- Choose your name from directory --</option>
                </select>
            </div>
        </header>

        <div class="space-y-10">
            <section>
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
                    <span class="bg-orange-100 text-orange-600 p-1.5 rounded-xl text-base">🎟️</span> Available Pool
                </h2>
                <div id="poolList" class="space-y-3">
                    <p class="text-slate-400 py-4 italic text-center text-sm animate-pulse">Syncing with Google Sheets...</p>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
                    <span class="bg-emerald-100 text-emerald-600 p-1.5 rounded-xl text-base">🧡</span> Active Sevas
                </h2>
                <div id="queueList" class="space-y-3">
                    <p class="text-slate-400 py-4 italic text-center text-sm">No active sevas yet.</p>
                </div>
            </section>
        </div>
    </div>

    <script>
        // YOUR LIVE GOOGLE APPS SCRIPT URL LINKED DIRECTLY
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6vyOCivrSDjsHoCAVIVPV3eBDqHucTBrxTHFP5l-P-XI7znsoBQRQl31I9VqhElqn/exec";
        
        let globalMasterSevaks = [];

        // 1. FETCH LIVE DATA FROM GOOGLE SHEETS
        async function loadPortalData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                globalMasterSevaks = data.masterSevaks;
                
                populateSevakDropdown(data.masterSevaks);
                renderPortal(data.portalItems);
            } catch (error) {
                console.error("Error connecting to sheet script backend:", error);
                document.getElementById('poolList').innerHTML = '<p class="text-red-500 py-4 text-center text-sm">Error syncing rows. Refresh page.</p>';
            }
        }

        // 2. FILL DROPDOWN WITH COPIED DATA FROM 'SEVAKS' TAB
        function populateSevakDropdown(sevaks) {
            const select = document.getElementById('userSevakSelect');
            const currentSelection = select.value;
            
            select.innerHTML = '<option value="">-- Choose your name from directory --</option>';
            sevaks.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name} (${s.team})</option>`;
            });
            
            if(currentSelection) select.value = currentSelection;
        }

        // 3. CLAIM TASK (UPDATES THE 'MATCHES' TAB IN BACKGROUND)
        async function claimSeva(matchId) {
            const selectedSevakId = document.getElementById('userSevakSelect').value;
            
            if (!selectedSevakId) {
                alert("Please pick your name from the dropdown list at the top first!");
                return;
            }

            showLoading();
            
            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "claim", matchId: matchId, sevakId: selectedSevakId })
                });
                loadPortalData();
            } catch(e) {
                alert("Could not register claim. Try again!");
                loadPortalData();
            }
        }

        function showLoading() {
            document.getElementById('poolList').innerHTML = '<p class="text-slate-400 py-4 italic text-center text-sm animate-pulse">Writing data to Google Sheets...</p>';
        }

        // 4. BUILD APPLICATION INTERFACE CARDS
        function renderPortal(items) {
            const poolList = document.getElementById('poolList');
            const queueList = document.getElementById('queueList');
            
            let poolHTML = '';
            let queueHTML = '';

            items.forEach(item => {
                if (item.status === 'available') {
                    poolHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center transition-all hover:shadow-md">
                            <div class="pr-3">
                                <span class="font-semibold text-slate-700 text-sm block">${item.title}</span>
                                <p class="text-xs text-slate-400 mt-0.5">${item.description || 'No description added.'}</p>
                            </div>
                            <button onclick="claimSeva('${item.matchId}')" class="bg-orange-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md shadow-orange-100 hover:bg-orange-600 transition flex-shrink-0">Claim</button>
                        </div>
                    `;
                } else if (item.status === 'claimed') {
                    queueHTML += `
                        <div class="bg-white p-4 rounded-xl border-l-4 border-emerald-500 shadow-sm border border-slate-100 flex justify-between items-center">
                            <div>
                                <div class="font-bold text-slate-800 text-sm">${item.title}</div>
                                <div class="text-xs text-slate-400 mt-0.5">Assigned to: <span class="text-emerald-600 font-bold">${item.sevakName}</span> <span class="text-slate-300">|</span> <span class="italic text-slate-500">${item.sevakTeam}</span></div>
                            </div>
                            <span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider flex-shrink-0">In Progress</span>
                        </div>
                    `;
                }
            });

            poolList.innerHTML = poolHTML || '<p class="text-slate-400 py-4 italic text-center text-sm">All cleared! No tasks in the pool.</p>';
            queueList.innerHTML = queueHTML || '<p class="text-slate-400 py-4 italic text-center text-sm">No active tasks right now.</p>';
        }

        // Start app cycle
        loadPortalData();
    </script>
</body>
</html>
